name: Build Numismatics Aeronautics Bridge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile addon
        run: gradle --no-daemon clean build

      - name: Read mod version
        id: mod_version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify mod jar
        shell: bash
        env:
          MOD_VERSION: ${{ steps.mod_version.outputs.version }}
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$jar_file"
          jar tf "$jar_file" | grep -q 'META-INF/neoforge.mods.toml'
          jar tf "$jar_file" | grep -q 'numiaerobridge.mixins.json'
          jar tf "$jar_file" | grep -q 'DockingConnectorBlockEntityMixin.class'
          jar tf "$jar_file" | grep -q 'DockingConnectorTankMixin.class'
          jar tf "$jar_file" | grep -q 'DockingConnectorTankCapacityMixin.class'
          jar tf "$jar_file" | grep -q 'SalepointBlockItemMixin.class'
          jar tf "$jar_file" | grep -q 'SalepointBlockEntityMixin.class'
          jar tf "$jar_file" | grep -q 'DockingConnectorSalePointPonderPlugin.class'
          jar tf "$jar_file" | grep -q 'DockingConnectorSalePointScenes.class'
          jar tf "$jar_file" | grep -q 'DockingConnectorSalePointBehaviour.class'
          mkdir -p dist
          cp "$jar_file" "dist/Numismatics-Aeronautics-Bridge-${MOD_VERSION}.jar"
          sha256sum "dist/Numismatics-Aeronautics-Bridge-${MOD_VERSION}.jar" | tee dist/SHA256SUMS.txt

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: Numismatics-Aeronautics-Bridge-${{ steps.mod_version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          MOD_VERSION: ${{ steps.mod_version.outputs.version }}
        run: |
          tag="v${MOD_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping the published release unchanged."
          else
            gh release create "$tag" dist/*.jar dist/SHA256SUMS.txt --title "Numismatics Aeronautics Bridge $MOD_VERSION" --generate-notes
          fi
